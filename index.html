<!doctype html>
<html lang="sq">
  <head>
    <script>
      // Always land on top ("Ballina") on a fresh load/refresh, instead of the
      // browser restoring whatever scroll position was there before reloading.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);
    </script>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Primary SEO (Albanian-first, location-aware) -->
    <title>Jara Pharmacy | Farmaci moderne në Prizren</title>
    <meta

    />

    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://jarapharmacy.com/" />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter -->

    <meta name="twitter:title" content="Jara Pharmacy | Modern pharmacy in Prizren" />

      name="twitter:description"
      content="Carefully selected products for skin, hair, vitamins, supplements and daily care."
