<!doctype html>
<html lang="sq">
  <head>
    <script>
      // Always land on top ("Ballina") on a fresh load/refresh, instead of the
      // browser restoring whatever scroll position was there before reloading.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A5C44" />

    <!-- ------------------------------------------------------------------
      Brand splash, shown from the very first painted frame until React has
      mounted. Inline on purpose: #root stays empty until ~1.6 MB of JS has
      parsed, and the design tokens live in that same deferred bundle — so
      nothing here may depend on either. Colours are hardcoded hex and every
      selector is an #id, which no later Tailwind rule can outrank.
      Lifted by src/components/common/SplashHandoff.tsx.
    ------------------------------------------------------------------- -->
    <style>
      /* ----------------------------------------------------------------
        Only `opacity` and `transform` are ever animated here. This runs
        while the browser is parsing ~1.6 MB of JavaScript, so the main
        thread is blocked; those two properties are handled by the
        compositor and stay smooth through it. Anything else (stroke
        dashes, clip-path, animated filters) would stutter on exactly the
        mid-range phones the splash exists for.

        Three layers, one job each, because a running animation outranks a
        transition on the same property — entrance and exit cannot share an
        element:
          #jara-splash        backdrop + cross-fade
          #jara-splash-stage  entrance and exit
          #jara-splash-glow   the lime bloom
          #jara-splash-mark   the slow idle breath
      ---------------------------------------------------------------- */
      #jara-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        /* Byte-identical to Tailwind's bg-hero-forest, so handing over to the
           Hero is a pure cross-fade with no change of background colour. */
        background: #0a5c44;
        background: radial-gradient(120% 120% at 15% 10%, #0f7a57 0%, #0a5c44 42%, #073b2d 100%);
        opacity: 1;
        transition: opacity 650ms cubic-bezier(0.4, 0, 0.2, 1);
        /* Escape hatch: if the bundle never runs (404, offline, parse error),
           uncover the page after 10s rather than blocking it forever. Timed
           with animation-DELAY on purpose — the global reduced-motion rule in
           global.css collapses animation-duration but never the delay. */
        animation: jara-splash-bailout 1ms linear 10s forwards;
      }
      /* pointer-events off the moment we start fading, so a click on a
         now-visible Hero CTA is never swallowed mid-transition. */
      #jara-splash[data-hiding] {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes jara-splash-bailout {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      /* Every rule below states the RESTING look in the rule itself and puts
         the start of the motion in a `from` keyframe. The reduced-motion block
         at the bottom switches animations off, which falls back to these base
         values — not to the animation's last frame. Put `opacity: 0` in a base
         rule and the splash would render empty for those visitors. */
      #jara-splash-stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        animation: jara-splash-rise 900ms cubic-bezier(0.16, 1, 0.3, 1) 120ms both;
      }
      /* The exit is an animation replacing an animation. A transition here
         would lose: jara-splash-rise still holds its final frame, and
         animations outrank transitions in the cascade. */
      #jara-splash[data-hiding] #jara-splash-stage {
        animation: jara-splash-out 650ms cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      @keyframes jara-splash-rise {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Lifts away rather than cutting out, overlapping the Hero's entrance. */
      @keyframes jara-splash-out {
        from {
          transform: none;
        }
        to {
          transform: translateY(-8px) scale(1.06);
        }
      }

      /* Soft lime bloom behind the mark. `inset` centres it at 2.6x the mark
         without a centring translate, which would otherwise have to be
         repeated in every keyframe of the scale below. */
      #jara-splash-glow {
        position: absolute;
        inset: -80%;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, rgba(183, 229, 50, 0.28) 0%, rgba(183, 229, 50, 0) 70%);
        opacity: 0.55;
        animation: jara-splash-glow-in 1200ms cubic-bezier(0.16, 1, 0.3, 1) 60ms both;
      }
      @keyframes jara-splash-glow-in {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
        to {
          opacity: 0.55;
          transform: none;
        }
      }

      #jara-splash-mark {
        position: relative; /* paints above the glow */
        width: clamp(76px, 20vw, 104px);
        height: clamp(76px, 20vw, 104px);
        filter: drop-shadow(0 0 22px rgba(183, 229, 50, 0.16));
        animation: jara-splash-breathe 5200ms ease-in-out 1200ms infinite;
      }
      /* 1.8% of scale, no opacity: alive without the blink that reads as
         "still loading". */
      @keyframes jara-splash-breathe {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: scale(1.018);
        }
      }

      /* Duplicated here because global.css arrives too late to cover the
         splash. Only the decoration stops — deliberately NOT
         `#jara-splash { animation: none }`, which would kill the bail-out. */
      @media (prefers-reduced-motion: reduce) {
        #jara-splash-stage,
        #jara-splash-glow,
        #jara-splash-mark {
          animation: none;
        }
        #jara-splash {
          transition: none;
        }
      }
    </style>
    <noscript>
      <style>
        /* Without JS nothing can ever remove the overlay — never show it. */
        #jara-splash {
          display: none !important;
        }
      </style>
    </noscript>

    <!-- Google Search Console ownership verification -->
    <meta name="google-site-verification" content="9Hxwbzcqs3oUmdLGq9TCn_w-gObQiWikSwrXajI5qzo" />

    <!-- Favicon (recreated brand mark) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Primary SEO (Albanian-first, location-aware). "Barnatore" leads on
      purpose: it is the everyday Kosovar word for a pharmacy and the one people
      actually search for, while the site's own copy had only ever used
      "farmaci". Both words now appear, here and in the visible copy.
    -->
    <title>Barnatore në Prizren — Jara Pharmacy | 12 lokacione</title>
    <meta
      name="description"
      content="Jara Pharmacy — barnatore moderne në Prizren me 12 lokacione. Produkte farmaceutike, kozmetikë, suplemente dhe kujdes për lëkurë e flokë."
    />
    <meta name="keywords" content="barnatore Prizren, farmaci Prizren, Jara Pharmacy, barnatore afër meje, pharmacy Kosovo, kozmetikë, suplemente, skincare, haircare, vitamina, kolagjen" />
    <meta name="author" content="Jara Pharmacy" />
    <link rel="canonical" href="https://jara-pharmacy.com/" />

    <!--
      Albanian is the only addressable locale: the language toggle lives in
      localStorage, not in the URL, so there is no separate English address to
      point at yet. Self-reference + x-default is the honest set here.
    -->
    <link rel="alternate" hreflang="sq" href="https://jara-pharmacy.com/" />
    <link rel="alternate" hreflang="x-default" href="https://jara-pharmacy.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="business.business" />
    <meta property="og:site_name" content="Jara Pharmacy" />
    <meta property="og:title" content="Barnatore në Prizren — Jara Pharmacy | 12 lokacione" />
    <meta
      property="og:description"
      content="Produkte të zgjedhura për lëkurë, flokë, vitamina, suplemente dhe kujdes të përditshëm. 12 lokacione në Prizren e Rahovec."
    />
    <meta property="og:locale" content="sq_AL" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://jara-pharmacy.com/" />
    <meta property="og:image" content="https://jara-pharmacy.com/jara-pharmacy-social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jara Pharmacy logo — Farmaci moderne në Prizren" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barnatore në Prizren — Jara Pharmacy | 12 lokacione" />
    <meta
      name="twitter:description"
      content="Produkte të zgjedhura për lëkurë, flokë, vitamina, suplemente dhe kujdes të përditshëm. 12 lokacione në Prizren e Rahovec."
    />
    <meta name="twitter:image" content="https://jara-pharmacy.com/jara-pharmacy-social-preview.png" />
    <meta name="twitter:image:alt" content="Jara Pharmacy logo — Farmaci moderne në Prizren" />

    <!--
      Fonts: Inter (single primary UI font) with system fallback, self-hosted
      from /fonts. @font-face lives in src/styles/global.css. Preloading the
      latin file starts it before the CSS is parsed — it is on the critical
      path for every visitor, and it carries the Albanian ë/ç.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The storefront photo is the LCP element and the only eager image on the
      page, but it is discovered only after the whole bundle has parsed and
      rendered the <img>. Preloading starts it in the same wave as the script,
      so it is decoded by the time the splash lifts. No crossorigin — the <img>
      in src/sections/Hero.tsx has none, and a mismatch downloads it twice.
      Keep this URL byte-identical to that src.
    -->
    <link
      rel="preload"
      href="/pharmacy/jara-pharmacy-exterior.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />

    <!--
      Structured data. Built from src/data by vite/seo/schema.ts, not written by
      hand: this used to be a single Pharmacy node with one address, no
      coordinates and no opening hours, describing a twelve-branch business. The
      generated graph carries the organisation, the site and every branch with
      its own geo and hours, and cannot drift from what the page shows.
    -->
    <!--jara:json-ld-->
  </head>
  <body>
    <!--
      Brand splash. The mark is BrandLogo's `mark` variant in its on-dark
      colour pair, copied as raw SVG because BrandLogo derives its mask id from
      React useId() and so cannot be rendered here. No wordmark: Inter is
      font-display:swap, so any text would paint in a fallback and then jump.

      The empty glow div is decorative and comes first on purpose: both it and
      the mark are positioned, so document order alone puts the mark on top.
    -->
    <div id="jara-splash" aria-hidden="true">
      <div id="jara-splash-stage">
        <div id="jara-splash-glow"></div>
        <svg
          id="jara-splash-mark"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 120 120"
          width="120"
          height="120"
          fill="none"
        >
          <defs>
            <mask id="jara-splash-weave">
              <rect width="120" height="120" fill="#fff" />
              <circle cx="42" cy="42" r="12" fill="#000" />
              <circle cx="78" cy="78" r="12" fill="#000" />
            </mask>
          </defs>
          <rect
            x="42"
            y="18"
            width="36"
            height="84"
            rx="18"
            stroke="#B7E532"
            stroke-width="13"
            stroke-linejoin="round"
          />
          <g mask="url(#jara-splash-weave)">
            <rect
              x="18"
              y="42"
              width="84"
              height="36"
              rx="18"
              stroke="#FFFFFF"
              stroke-width="13"
              stroke-linejoin="round"
            />
          </g>
        </svg>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
